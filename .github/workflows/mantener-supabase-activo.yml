# Evita que Supabase (plan gratis) pause el proyecto por inactividad: consulta la base cada 3 días.
# Requiere el secret SUPABASE_DB_URL en GitHub: Settings → Secrets and variables → Actions
name: Mantener Supabase activo
on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then echo "Falta el secret SUPABASE_DB_URL"; exit 1; fi
          pip install --quiet psycopg2-binary
          python -c "import os, psycopg2; c = psycopg2.connect(os.environ['DB_URL']); cur = c.cursor(); cur.execute('select 1'); print('Supabase activo:', cur.fetchone()[0]); c.close()"
